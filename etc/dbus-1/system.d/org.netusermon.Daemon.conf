<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root to own the service name -->
  <policy user="root">
    <allow own="org.netusermon.Daemon"/>
    <allow send_destination="org.netusermon.Daemon"/>
  </policy>

  <!-- Allow anyone to invoke methods on the service -->
  <policy context="default">
    <allow send_destination="org.netusermon.Daemon"/>
    <allow receive_sender="org.netusermon.Daemon"/>
  </policy>
</busconfig>
